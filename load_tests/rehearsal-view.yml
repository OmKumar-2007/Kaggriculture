name: farmcraft-rehearsal-view
services:
  api_rehearsal:
    image: kaggriculture-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg://arena:${POSTGRES_PASSWORD}@postgres:5432/farmcraft_rehearsal_20261010_r2
      REDIS_URL: redis://redis:6379/2
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /data/objects
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: rehearsal-${ADMIN_SESSION_SECRET}
      APP_ENV: local
      LOAD_TEST_FAKE_SIMULATION: "0"
    volumes:
      - ../../farmcraft-rehearsal-storage-r2:/data/objects:ro
    networks: [main]
    restart: unless-stopped
  web_rehearsal:
    image: kaggriculture-web:latest
    ports: ["127.0.0.1:18000:80"]
    volumes:
      - ./nginx-rehearsal.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [main]
    depends_on: [api_rehearsal]
    restart: unless-stopped
networks:
  main:
    external: true
    name: kaggriculture_default
