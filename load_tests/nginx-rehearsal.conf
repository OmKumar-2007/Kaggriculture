server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 300k;

    location = /api/admin/login {
        proxy_pass http://api_rehearsal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/admin/logout {
        proxy_pass http://api_rehearsal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|botlab|jobs|teams|sandbox|replays|starter|event|tournament)(/|$) {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://api_rehearsal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/(players|leaderboard|register|validate|guide|health|ready)$ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://api_rehearsal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
