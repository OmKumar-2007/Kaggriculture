databases:
  - name: neural-coliseum-db
    plan: free
    region: singapore

services:
  - type: keyvalue
    name: neural-coliseum-redis
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: neural-coliseum-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars: &api-env
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://neural-coliseum.onrender.com
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: neural-coliseum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: neural-coliseum-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: SIMULATION_WORKERS
        value: "2"
      - key: MATCH_TIMEOUT_SECONDS
        value: "120"
      - key: LOAD_TEST_FAKE_SIMULATION
        value: "0"

  # Render has no Docker daemon. Real untrusted scoring must run this worker on
  # the isolated runner architecture documented in SCALING.md.
  - type: worker
    name: neural-coliseum-worker
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.worker
    envVars: *api-env

  - type: web
    name: neural-coliseum
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://neural-coliseum-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
