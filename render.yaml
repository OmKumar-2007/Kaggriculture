# Free Render control plane. Evaluations run on registered outbound workers
# (dedicated Azure VM or organizer laptop), never in the Render web process.
# Set sync:false secrets in the Render Dashboard before the first deploy.
services:
  - type: web
    name: farmcraft-free-api
    branch: farmcraft-free-remote
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: QUEUE_BACKEND
        value: postgres
      - key: FARMCRAFT_EVALUATOR_VERSION
        value: 2026.10.09
      - key: WORKER_REGISTRATION_ENABLED
        value: "1"
      - key: LOAD_TEST_FAKE_SIMULATION
        value: "0"
      - key: STORAGE_BACKEND
        value: s3
      - key: PUBLIC_BASE_URL
        value: https://farmcraft-free-web.onrender.com
      - key: CORS_ORIGINS
        value: https://farmcraft-free-web.onrender.com
      - key: PARTICIPANT_HEARTBEAT_SECONDS
        value: "60"
      - key: DATABASE_URL
        sync: false # Neon pooled PostgreSQL URL, sslmode=require
      - key: REDIS_URL
        sync: false # Upstash Free TLS URL, used only for browser sessions
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false # Neon Object Storage S3-compatible endpoint
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true

  - type: web
    name: farmcraft-free-web
    branch: farmcraft-free-remote
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Render static-site rewrites keep browser sessions on one origin.
      - type: rewrite
        source: /api/*
        destination: https://farmcraft-free-api.onrender.com/api/*
      - type: rewrite
        source: /botlab/*
        destination: https://farmcraft-free-api.onrender.com/botlab/*
      - type: rewrite
        source: /jobs/*
        destination: https://farmcraft-free-api.onrender.com/jobs/*
      - type: rewrite
        source: /teams/*
        destination: https://farmcraft-free-api.onrender.com/teams/*
      - type: rewrite
        source: /sandbox/*
        destination: https://farmcraft-free-api.onrender.com/sandbox/*
      - type: rewrite
        source: /replays/*
        destination: https://farmcraft-free-api.onrender.com/replays/*
      - type: rewrite
        source: /tournament/*
        destination: https://farmcraft-free-api.onrender.com/tournament/*
      - type: rewrite
        source: /event/*
        destination: https://farmcraft-free-api.onrender.com/event/*
      - type: rewrite
        source: /players
        destination: https://farmcraft-free-api.onrender.com/players
      - type: rewrite
        source: /leaderboard
        destination: https://farmcraft-free-api.onrender.com/leaderboard
      - type: rewrite
        source: /register
        destination: https://farmcraft-free-api.onrender.com/register
      - type: rewrite
        source: /validate
        destination: https://farmcraft-free-api.onrender.com/validate
      - type: rewrite
        source: /starter/download
        destination: https://farmcraft-free-api.onrender.com/starter/download
      - type: rewrite
        source: /guide
        destination: https://farmcraft-free-api.onrender.com/guide
      - type: rewrite
        source: /*
        destination: /index.html
