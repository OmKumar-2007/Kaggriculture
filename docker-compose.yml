services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neural_coliseum
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start-server.ps1 to configure POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d neural_coliseum"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://arena:${POSTGRES_PASSWORD}@postgres:5432/neural_coliseum
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /data/objects
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run start-server.ps1 to configure ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Run start-server.ps1 to configure ADMIN_SESSION_SECRET}
      APP_ENV: local
      MAX_ACTIVE_SANDBOX_PER_TEAM: ${MAX_ACTIVE_SANDBOX_PER_TEAM:-1}
      MAX_ACTIVE_OFFICIAL_PER_TEAM: ${MAX_ACTIVE_OFFICIAL_PER_TEAM:-1}
      MAX_SUBMISSION_SIZE_KB: ${MAX_SUBMISSION_SIZE_KB:-256}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-100}
      MAX_INFRASTRUCTURE_RETRIES: ${MAX_INFRASTRUCTURE_RETRIES:-2}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./data/objects:/data/objects"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["${FARMCRAFT_BIND_IP:-0.0.0.0}:${FARMCRAFT_PORT:-8000}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
